&lt;html lang=&quot;ko&quot;&gt;
&lt;head&gt;
&lt;meta charset=&quot;UTF-8&quot;&gt;
&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;
&lt;title&gt;나고야 여행 플랜 🇯🇵&lt;/title&gt;
&lt;link href=&quot;https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&amp;family=DM+Serif+Display:ital@0;1&amp;display=swap&quot; rel=&quot;stylesheet&quot;&gt;
&lt;style&gt;
:root {
  --bg: #f7f6f2;
  --white: #ffffff;
  --surface: #f0efe9;
  --border: #e4e2da;
  --border2: #d0cec4;
  --text: #1a1916;
  --muted: #7a7870;
  --accent: #b8860b;
  --accent-bg: #fdf3d8;
  --accent-border: #e8c97a;
  --teal: #0f6e56;
  --teal-bg: #e8f5f0;
  --red: #c0392b;
  --red-bg: #fdecea;
  --green: #2d7a4f;
  --green-bg: #eaf5ee;
  --blue: #1a5fa8;
  --blue-bg: #e8f1fb;
  --gray-bg: #f0efe9;
  --orange: #b85c0b;
  --orange-bg: #fef0e6;
  --done-bg: #eceae2;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: &#x27;Noto Sans KR&#x27;, sans-serif;
  font-weight: 300;
  min-height: 100vh;
  padding-bottom: 130px;
}

/* HERO */
.hero {
  position: relative; padding: 52px 20px 32px;
  overflow: hidden; background: var(--white);
  border-bottom: 1px solid var(--border);
}
.hero::before {
  content: &#x27;名古屋&#x27;; position: absolute; top: -8px; right: -8px;
  font-size: 110px; font-family: serif; color: rgba(184,134,11,0.06);
  line-height: 1; pointer-events: none; letter-spacing: -4px;
}
.hero-label { font-size: 11px; letter-spacing: 3px; color: var(--accent); text-transform: uppercase; margin-bottom: 8px; font-weight: 500; }
.hero-title { font-family: &#x27;DM Serif Display&#x27;, serif; font-size: 36px; line-height: 1.1; color: var(--text); margin-bottom: 6px; }
.hero-title em { font-style: italic; color: var(--accent); }
.hero-sub { font-size: 13px; color: var(--muted); margin-bottom: 22px; }
.flights { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 4px; }
.flight-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 13px 14px; }
.flight-dir { font-size: 10px; letter-spacing: 2px; color: var(--accent); text-transform: uppercase; margin-bottom: 5px; font-weight: 500; }
.flight-route { font-size: 13px; font-weight: 500; color: var(--text); line-height: 1.4; }
.flight-detail { font-size: 11px; color: var(--muted); margin-top: 3px; }

/* HOTEL */
.hotel-strip {
  display: flex; align-items: center; gap: 10px;
  background: var(--white); border: 1px solid var(--border);
  border-radius: 12px; padding: 11px 15px; margin: 10px 20px 0;
}
.hotel-icon { width: 34px; height: 34px; background: var(--accent-bg); border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
.hotel-name { font-size: 13px; font-weight: 500; color: var(--text); }
.hotel-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

/* PROGRESS */
.progress-wrap { padding: 16px 20px 0; }
.progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.progress-label { font-size: 12px; color: var(--muted); font-weight: 500; }
.progress-count { font-size: 12px; color: var(--accent); font-weight: 700; }
.progress-bar { height: 4px; background: var(--border); border-radius: 99px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.4s ease; }

/* TABS */
.tabs-wrap {
  padding: 16px 20px 14px; position: sticky; top: 0; z-index: 100;
  background: var(--bg); border-bottom: 1px solid var(--border);
}
.tabs { display: flex; gap: 7px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex-shrink: 0; padding: 8px 15px; border-radius: 99px;
  border: 1px solid var(--border2); background: var(--white);
  color: var(--muted); font-size: 13px; font-family: &#x27;Noto Sans KR&#x27;, sans-serif;
  font-weight: 400; cursor: pointer; transition: all 0.2s; white-space: nowrap;
}
.tab.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
.tab-cnt { font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 99px; margin-left: 3px; background: var(--accent-bg); color: var(--accent); }
.tab.active .tab-cnt { background: rgba(255,255,255,0.25); color: #fff; }

/* PANELS */
.panel { display: none; padding: 0 20px; }
.panel.show { display: block; }

.day-heading { margin-bottom: 18px; }
.day-date { font-size: 11px; letter-spacing: 2px; color: var(--accent); text-transform: uppercase; font-weight: 500; margin-bottom: 4px; }
.day-title { font-family: &#x27;DM Serif Display&#x27;, serif; font-size: 22px; color: var(--text); line-height: 1.2; }
.day-title em { font-style: italic; color: var(--teal); }

/* ALERTS */
.alert { background: var(--red-bg); border: 1px solid rgba(192,57,43,0.2); border-radius: 12px; padding: 13px 15px; margin-bottom: 14px; font-size: 13px; line-height: 1.6; color: var(--red); }
.alert strong { color: #8b1a10; font-weight: 700; }
.alert-info { background: var(--teal-bg); border-color: rgba(15,110,86,0.2); color: var(--teal); }
.alert-info strong { color: #084d3b; }
.alert-warn { background: var(--accent-bg); border-color: rgba(184,134,11,0.25); color: #7a5a00; }
.alert-warn strong { color: #5a3f00; }

/* TIMELINE */
.timeline { display: flex; flex-direction: column; }
.tl-item { display: flex; gap: 14px; position: relative; }
.tl-item:not(:last-child) .tl-line::after {
  content: &#x27;&#x27;; position: absolute; left: 50%; top: 26px; bottom: -10px;
  width: 1px; background: var(--border); transform: translateX(-50%);
}
.tl-left { flex-shrink: 0; width: 38px; display: flex; flex-direction: column; align-items: center; padding-top: 2px; }
.tl-line { position: relative; display: flex; flex-direction: column; align-items: center; }
.tl-dot {
  width: 22px; height: 22px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700; flex-shrink: 0;
  border: 1.5px solid; background: var(--white);
  position: relative; z-index: 1; transition: opacity 0.3s;
}
.dot-sight { border-color: var(--teal); color: var(--teal); }
.dot-food  { border-color: var(--green); color: var(--green); }
.dot-move  { border-color: var(--muted); color: var(--muted); }
.dot-shop  { border-color: var(--orange); color: var(--orange); }
.dot-key   { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }
.dot-alert { border-color: var(--red); color: var(--red); }
.tl-item.done-item .tl-dot { opacity: 0.3; }

.tl-body { flex: 1; padding-bottom: 16px; }
.tl-time { font-size: 11px; color: var(--muted); font-weight: 500; margin-bottom: 3px; }

/* CARD + CHECK */
.tl-card {
  background: var(--white); border: 1px solid var(--border);
  border-radius: 14px; padding: 13px 14px;
  cursor: pointer; transition: background 0.25s, border-color 0.25s;
  -webkit-tap-highlight-color: transparent; user-select: none;
}
.tl-card:active { transform: scale(0.985); }
.tl-card.hl { border-color: var(--accent-border); border-width: 1.5px; background: var(--accent-bg); }
.check-row { display: flex; align-items: flex-start; gap: 10px; }
.chk {
  flex-shrink: 0; width: 20px; height: 20px; border-radius: 6px;
  border: 1.5px solid var(--border2); background: var(--white);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: transparent; transition: all 0.2s; margin-top: 1px;
}
.cc { flex: 1; }

/* DONE STATE */
.tl-card.done { background: var(--done-bg); border-color: var(--border); }
.tl-card.done.hl { background: var(--done-bg); border-color: var(--border); }
.tl-card.done .chk { background: var(--accent); border-color: var(--accent); color: #fff; }
.tl-card.done .tl-place { text-decoration: line-through; color: var(--muted); }
.tl-card.done .tl-desc { opacity: 0.45; }
.tl-card.done .tl-tags { opacity: 0.35; }

.tl-place { font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 5px; line-height: 1.35; transition: color 0.25s; }
.tl-desc { font-size: 13px; color: var(--muted); line-height: 1.6; transition: opacity 0.25s; }
.tl-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; transition: opacity 0.25s; }
.tag { font-size: 11px; padding: 2px 9px; border-radius: 99px; font-weight: 500; }
.tag-yellow { background: var(--accent-bg); color: var(--accent); }
.tag-teal   { background: var(--teal-bg); color: var(--teal); }
.tag-red    { background: var(--red-bg); color: var(--red); }
.tag-green  { background: var(--green-bg); color: var(--green); }
.tag-gray   { background: var(--gray-bg); color: var(--muted); border: 1px solid var(--border); }
.tag-orange { background: var(--orange-bg); color: var(--orange); }
.tag-star   { background: var(--accent-bg); color: var(--accent); border: 1px solid var(--accent-border); }

/* SUMMARY */
.sect-divider { height: 1px; background: var(--border); margin: 22px 0 18px; }
.summary-section { margin-bottom: 10px; }
.summary-title { font-size: 11px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; font-weight: 500; margin-bottom: 12px; }
.chip-grid { display: flex; flex-direction: column; gap: 8px; }
.chip-row { display: flex; align-items: flex-start; gap: 10px; background: var(--white); border: 1px solid var(--border); border-radius: 12px; padding: 11px 13px; }
.chip-emoji { font-size: 17px; flex-shrink: 0; padding-top: 1px; }
.chip-label { font-size: 12px; color: var(--muted); margin-bottom: 3px; font-weight: 500; }
.chip-val { font-size: 13px; color: var(--text); line-height: 1.5; }
.tip-box { background: var(--accent-bg); border: 1px solid var(--accent-border); border-radius: 12px; padding: 12px 14px; margin-top: 10px; }
.tip-box p { font-size: 13px; color: #7a5a00; line-height: 1.6; }
.tip-box strong { color: #5a3f00; font-weight: 500; }

/* BOTTOM NAV */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(255,255,255,0.96); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--border); padding: 10px 16px 20px;
  display: flex; gap: 6px; z-index: 200;
  overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
}
.bottom-nav::-webkit-scrollbar { display: none; }
.bnav-btn {
  flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 9px 13px; border-radius: 12px; border: 1px solid var(--border);
  background: var(--white); cursor: pointer; font-family: &#x27;Noto Sans KR&#x27;, sans-serif;
  transition: all 0.2s; min-width: 72px;
}
.bnav-btn.active { background: var(--accent-bg); border-color: var(--accent-border); }
.bnav-day { font-size: 10px; color: var(--muted); font-weight: 500; }
.bnav-btn.active .bnav-day { color: var(--accent); }
.bnav-label { font-size: 12px; color: var(--text); white-space: nowrap; font-weight: 400; }

@media (min-width: 480px) { .hero-title { font-size: 46px; } }

let checkedIds=new Set(JSON.parse(localStorage.getItem(&#x27;jp_checked&#x27;)||&#x27;[]&#x27;));
let collapsedCats=new Set(JSON.parse(localStorage.getItem(&#x27;jp_collapsed&#x27;)||&#x27;[]&#x27;));

function saveChecked(){localStorage.setItem(&#x27;jp_checked&#x27;,JSON.stringify([...checkedIds]));}
function saveCollapsed(){localStorage.setItem(&#x27;jp_collapsed&#x27;,JSON.stringify([...collapsedCats]));}

function renderAll(){
  const root=document.getElementById(&#x27;categoriesRoot&#x27;);
  root.innerHTML=&#x27;&#x27;;
  CATEGORIES.forEach(cat=&gt;{
    const items=PRODUCTS.filter(p=&gt;p.category===cat.key);
    if(!items.length)return;
    const section=document.createElement(&#x27;div&#x27;);
    section.className=&#x27;category-section&#x27;+(cat.pending?&#x27; pending&#x27;:&#x27;&#x27;)+(collapsedCats.has(cat.key)?&#x27; collapsed&#x27;:&#x27;&#x27;);
    const checkedInCat=items.filter(p=&gt;checkedIds.has(p.id)).length;
    section.innerHTML=`&lt;div class=&quot;category-header&quot; data-cat=&quot;${cat.key}&quot;&gt;&lt;div class=&quot;cat-left&quot;&gt;&lt;span class=&quot;cat-icon&quot;&gt;${cat.icon}&lt;/span&gt;&lt;span class=&quot;cat-name&quot;&gt;${cat.key}&lt;/span&gt;&lt;span class=&quot;cat-count&quot;&gt;${checkedInCat}/${items.length}&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;cat-arrow&quot;&gt;▾&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;category-body&quot;&gt;&lt;/div&gt;`;
    root.appendChild(section);
    const body=section.querySelector(&#x27;.category-body&#x27;);
    items.forEach(p=&gt;body.appendChild(renderCard(p)));
    section.querySelector(&#x27;.category-header&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{
      if(collapsedCats.has(cat.key))collapsedCats.delete(cat.key);else collapsedCats.add(cat.key);
      saveCollapsed();section.classList.toggle(&#x27;collapsed&#x27;);
    });
  });
  applyFilter();updateProgress();
}

function renderCard(p){
  const div=document.createElement(&#x27;div&#x27;);
  div.className=&#x27;product-card&#x27;+(checkedIds.has(p.id)?&#x27; checked&#x27;:&#x27;&#x27;);
  div.dataset.id=p.id;
  let imgContent;
  if(p.image){
    imgContent=`&lt;img src=&quot;${p.image}&quot; alt=&quot;${p.name}&quot; onerror=&quot;this.style.display=&#x27;none&#x27;&quot;&gt;`;
  } else {
    imgContent=`&lt;div class=&quot;img-search-btn&quot; title=&quot;상품 이미지&quot;&gt;&lt;span class=&quot;isb-emoji&quot;&gt;${p.imageEmoji}&lt;/span&gt;&lt;span class=&quot;isb-label&quot;&gt;상품&lt;br&gt;이미지&lt;/span&gt;&lt;/div&gt;`;
  }
  const priceExtra=p.priceVerified
    ?&#x27;&lt;span class=&quot;badge-verified&quot;&gt;✓ 실측가&lt;/span&gt;&#x27;
    :&#x27;&lt;span class=&quot;price-note&quot;&gt;(예상가)&lt;/span&gt;&#x27;;
  div.innerHTML=`&lt;div class=&quot;card-top&quot;&gt;&lt;div class=&quot;check-area&quot;&gt;&lt;label&gt;&lt;input type=&quot;checkbox&quot; ${checkedIds.has(p.id)?&#x27;checked&#x27;:&#x27;&#x27;}&gt;&lt;div class=&quot;check-box&quot;&gt;&lt;/div&gt;&lt;/label&gt;&lt;/div&gt;&lt;div class=&quot;product-img-wrap&quot;&gt;${imgContent}&lt;/div&gt;&lt;div class=&quot;product-info&quot;&gt;&lt;div class=&quot;product-name-row&quot;&gt;&lt;span class=&quot;product-name&quot;&gt;${p.name}&lt;/span&gt;${p.needsConfirm?&#x27;&lt;span class=&quot;badge-confirm&quot;&gt;⚠️ 확인 필요&lt;/span&gt;&#x27;:&#x27;&#x27;}&lt;/div&gt;&lt;div class=&quot;product-jp-name&quot;&gt;${p.jpName}&lt;/div&gt;&lt;div class=&quot;product-price&quot;&gt;${p.price} ${priceExtra}&lt;/div&gt;&lt;div class=&quot;tags&quot;&gt;${p.stores.map(s=&gt;`&lt;span class=&quot;tag store&quot;&gt;📍${s}&lt;/span&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;${p.memo?`&lt;div class=&quot;product-memo&quot;&gt;📝 ${p.memo.replace(/\n/g,&#x27;&lt;br&gt;&#x27;)}&lt;/div&gt;`:&#x27;&#x27;}`;
  div.querySelector(&#x27;input[type=&quot;checkbox&quot;]&#x27;).addEventListener(&#x27;change&#x27;,e=&gt;{
    if(e.target.checked)checkedIds.add(p.id);else checkedIds.delete(p.id);
    saveChecked();div.classList.toggle(&#x27;checked&#x27;,e.target.checked);
    updateProgress();updateCatCounts();applyFilter();
  });
  return div;
}

function updateProgress(){
  const total=PRODUCTS.filter(p=&gt;p.category!==&#x27;보류&#x27;).length;
  const done=PRODUCTS.filter(p=&gt;p.category!==&#x27;보류&#x27;&amp;&amp;checkedIds.has(p.id)).length;
  document.getElementById(&#x27;progressText&#x27;).textContent=`${done} / ${total} 구매 완료`;
  document.getElementById(&#x27;progressBar&#x27;).style.width=total?(done/total*100)+&#x27;%&#x27;:&#x27;0%&#x27;;
}

function updateCatCounts(){
  CATEGORIES.forEach(cat=&gt;{
    const items=PRODUCTS.filter(p=&gt;p.category===cat.key);
    const checked=items.filter(p=&gt;checkedIds.has(p.id)).length;
    const el=document.querySelector(`[data-cat=&quot;${cat.key}&quot;]`)?.querySelector(&#x27;.cat-count&#x27;);
    if(el)el.textContent=`${checked}/${items.length}`;
  });
}

function applyFilter(){
  const q=searchQuery.toLowerCase();
  let anyVisible=false;
  document.querySelectorAll(&#x27;.product-card&#x27;).forEach(card=&gt;{
    const p=PRODUCTS.find(x=&gt;x.id===card.dataset.id);
    if(!p)return;
    const isChecked=checkedIds.has(p.id);
    let show=true;
    if(currentFilter===&#x27;unpurchased&#x27;)show=!isChecked;
    else if(currentFilter===&#x27;purchased&#x27;)show=isChecked;
    else if(currentFilter===&#x27;confirm&#x27;)show=p.needsConfirm;
    if(show&amp;&amp;q){const h=[p.name,p.jpName,p.memo,...p.stores].join(&#x27; &#x27;).toLowerCase();show=h.includes(q);}
    card.classList.toggle(&#x27;hidden&#x27;,!show);
    if(show)anyVisible=true;
  });
  document.getElementById(&#x27;emptyState&#x27;).classList.toggle(&#x27;visible&#x27;,!anyVisible);
}

renderAll();
document.querySelectorAll(&#x27;.filter-btn&#x27;).forEach(btn=&gt;{
  btn.addEventListener(&#x27;click&#x27;,()=&gt;{
    document.querySelectorAll(&#x27;.filter-btn&#x27;).forEach(b=&gt;b.classList.remove(&#x27;active&#x27;));
    btn.classList.add(&#x27;active&#x27;);currentFilter=btn.dataset.filter;applyFilter();
  });
});
document.getElementById(&#x27;searchInput&#x27;).addEventListener(&#x27;input&#x27;,e=&gt;{searchQuery=e.target.value;applyFilter();});
document.getElementById(&#x27;resetBtn&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{
  if(confirm(&#x27;구매 체크를 모두 초기화할까요?&#x27;)){checkedIds.clear();saveChecked();renderAll();}
});
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
